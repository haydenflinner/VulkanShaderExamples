name: Benchmark

on:
  # Manual trigger only: absolute fps on shared CI runners is informational,
  # not a gate. Artifacts keep per-example glsl-vs-rust fps for trending.
  workflow_dispatch:

jobs:
  benchmark:
    name: Rust-vs-GLSL benchmark matrix (llvmpipe)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:kisak/turtle -y
          sudo apt-get update -y -qq
          sudo apt install -y libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            xvfb libgl1-mesa-dri libxcb-xfixes0-dev libxcb1-dev

      - name: Build examples
        run: |
          cmake -B build
          cmake --build build -j"$(nproc)"

      - name: Run benchmark matrix under Xvfb + llvmpipe
        run: |
          xvfb-run -a python3 tools/benchmark.py \
            --warmup-s 2 --duration-s 5 \
            --json benchmark-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
